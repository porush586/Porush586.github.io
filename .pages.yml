
media:
  input: media
  output: /media

content:
  - name: posts
    label: Blog Articles
    type: collection
    path: content/posts
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: Blog Title
        type: string
        required: true

      - name: description
        label: Short Description
        type: text

      - name: category
        label: Category
        type: select
        options:
          values:
            - Technology
            - Education
            - Science
            - Current Affairs
            - Knowledge
            - Lifestyle
            - Personal
            - Other

      - name: date
        label: Publish Date
        type: date

      - name: cover
        label: Featured Image
        type: image

      - name: body
        label: Full Article
        type: rich-text
        options:
          format: markdown
          switcher: true
